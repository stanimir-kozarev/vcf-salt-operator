---
# Credentials Secret for the SaltKeyConfig.
# Replace base64-encoded values with your actual VCF Salt credentials:
#   echo -n 'your-username' | base64
#   echo -n 'your-password' | base64
apiVersion: v1
kind: Secret
metadata:
  name: salt-raas-creds
  namespace: my-supervisor-namespace
type: Opaque
data:
  username: YWRtaW4=      # base64("admin")   — replace with your username
  password: Y2hhbmdlbWU=  # base64("changeme") — replace with your password
