#@data/values
---
namespace: vcf-salt-operator-system

image:
  repository: ghcr.io/stanimir-kozarev/vcf-salt-operator
  tag: "0.2.0"
  pullPolicy: IfNotPresent

resources:
  limits:
    cpu: "500m"
    memory: "128Mi"
  requests:
    cpu: "10m"
    memory: "64Mi"

imagePullSecret:
  dockerconfigjson: ""

raas:
  defaultInsecureSkipVerify: false
  connectionSecret: raas-connection
  connection:
    url: ""
    masterID: ""
    username: ""
    password: ""
    insecureSkipVerify: false

enrolment:
  namespaces: []
  all: false
  namespaceSelector: ""
  excludePrefixes: ""
  keyAcceptance: discovery

scavenger:
  excludeMinions: ""

rbac:
  tenantCredentialSecrets: true
  preseedKeys: false
