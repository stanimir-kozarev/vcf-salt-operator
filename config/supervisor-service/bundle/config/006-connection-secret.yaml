#@ load("@ytt:data", "data")
#@ if data.values.raas.connection.username != "":
---
apiVersion: v1
kind: Secret
type: Opaque
metadata:
  name: #@ data.values.raas.connectionSecret
  namespace: #@ data.values.namespace
  labels:
    app.kubernetes.io/name: vcf-salt-operator
    app.kubernetes.io/managed-by: supervisor-service
stringData:
  url: #@ data.values.raas.connection.url
  masterID: #@ data.values.raas.connection.masterID
  username: #@ data.values.raas.connection.username
  password: #@ data.values.raas.connection.password
  skipTLSVerify: #@ "{}".format(data.values.raas.connection.insecureSkipVerify).lower()
#@ end
