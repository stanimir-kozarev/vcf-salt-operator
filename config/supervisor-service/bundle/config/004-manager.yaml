#@ load("@ytt:data", "data")
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: controller-manager
  namespace: #@ data.values.namespace
  labels:
    control-plane: controller-manager
    app.kubernetes.io/name: vcf-salt-operator
    app.kubernetes.io/component: controller
spec:
  replicas: 1
  selector:
    matchLabels:
      control-plane: controller-manager
      app.kubernetes.io/name: vcf-salt-operator
  template:
    metadata:
      annotations:
        kubectl.kubernetes.io/default-container: manager
      labels:
        control-plane: controller-manager
        app.kubernetes.io/name: vcf-salt-operator
    spec:
      serviceAccountName: controller-manager
      terminationGracePeriodSeconds: 10
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      #@ if data.values.imagePullSecret.dockerconfigjson != "":
      imagePullSecrets:
      - name: registry-credentials
      #@ end
      volumes:
      - name: tmp
        emptyDir: {}
      containers:
      - name: manager
        image: #@ "{}:{}".format(data.values.image.repository, data.values.image.tag)
        imagePullPolicy: #@ data.values.image.pullPolicy
        command: ["/manager"]
        args:
        - --leader-elect
        - --health-probe-bind-address=:8081
        - --metrics-bind-address=0
        - #@ "--default-connection-secret={}".format(data.values.raas.connectionSecret)
        #@ if len(data.values.enrolment.namespaces) > 0:
        - #@ "--enrol-namespaces={}".format(",".join(data.values.enrolment.namespaces))
        #@ end
        #@ if data.values.enrolment.all:
        - --enrol-all-namespaces
        #@ end
        #@ if data.values.enrolment.namespaceSelector != "":
        - #@ "--enrol-namespace-selector={}".format(data.values.enrolment.namespaceSelector)
        #@ end
        #@ if data.values.enrolment.excludePrefixes != "":
        - #@ "--enrol-exclude-prefixes={}".format(data.values.enrolment.excludePrefixes)
        #@ end
        - #@ "--enrol-key-acceptance={}".format(data.values.enrolment.keyAcceptance)
        env:
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        securityContext:
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8081
          initialDelaySeconds: 15
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8081
          initialDelaySeconds: 5
          periodSeconds: 10
        resources:
          limits:
            cpu: #@ data.values.resources.limits.cpu
            memory: #@ data.values.resources.limits.memory
          requests:
            cpu: #@ data.values.resources.requests.cpu
            memory: #@ data.values.resources.requests.memory
