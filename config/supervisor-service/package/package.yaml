---
apiVersion: data.packaging.carvel.dev/v1alpha1
kind: Package
metadata:
  name: vcf-salt-operator.salt.vcf.io.__VERSION__
  namespace: vmware-system-supervisor-services
spec:
  refName: vcf-salt-operator.salt.vcf.io
  version: __VERSION__
  releaseNotes: |
    - Default RaaS connection from the install values under raas.connection, used by
      every SaltKeyConfig without spec.credentialsSecret
    - Automatic enrolment of the namespaces named under enrolment, each with a
      SaltKeyConfig on the default connection, removed again when a team's own config
      appears, the namespace leaves enrolment or enrolment is turned off
    - SaltKeyConfig.spec.vmSelector limits which annotated VMs are onboarded
    - Scavenger exclusions under scavenger.excludeMinions
    - VM reconvergence from terminal Failed/<step> states, triggered by an intent
      annotation change, a per-VM salt.vcf.io/retry-request, or a namespace-wide
      SaltKeyConfig.spec.retryToken
    - Day-2 change detection covers the full tenant-set salt.vcf.io/* annotation set,
      not only salt.vcf.io/roles
    - Scavenger CronJob defaults to --dry-run=true; a key with no correlated VM is
      logged at error level in both modes
    - Package version/name and image tag default are now templated from VERSION at
      build time instead of hand-maintained, and the default namespace matches the
      one VCF9 actually activates Supervisor Service packages under
    - Air-gap relocation (imgpkg copy) now carries cosign signatures across the hop
      (--cosign-signatures); it was previously silently dropped
  valuesSchema:
    openAPIv3:
      title: vcf-salt-operator.salt.vcf.io values schema
      type: object
      additionalProperties: false
      properties:
        namespace:
          type: string
          default: vcf-salt-operator-system
          description: Namespace where the operator and scavenger are deployed.
        image:
          type: object
          description: Operator container image settings.
          properties:
            repository:
              type: string
              default: ghcr.io/stanimir-kozarev/vcf-salt-operator
            tag:
              type: string
              default: "__VERSION__"
            pullPolicy:
              type: string
              default: IfNotPresent
              enum: ["Always", "IfNotPresent", "Never"]
        resources:
          type: object
          properties:
            limits:
              type: object
              properties:
                cpu:
                  type: string
                  default: "500m"
                memory:
                  type: string
                  default: "128Mi"
            requests:
              type: object
              properties:
                cpu:
                  type: string
                  default: "10m"
                memory:
                  type: string
                  default: "64Mi"
        imagePullSecret:
          type: object
          description: |
            Optional registry credentials. If dockerconfigjson is set, a Secret
            is created and wired to the operator and scavenger pods.
          properties:
            dockerconfigjson:
              type: string
              default: ""
              description: Base64-encoded contents of a .dockerconfigjson file.
        raas:
          type: object
          description: VCF Salt (RaaS) client defaults.
          properties:
            defaultInsecureSkipVerify:
              type: boolean
              default: false
              description: |
                Deprecated and ignored. Use raas.connection.insecureSkipVerify, or
                spec.skipTLSVerify on a SaltKeyConfig with its own credentials
                Secret. Kept so existing install values still validate.
            connectionSecret:
              type: string
              default: raas-connection
              description: Name of the Secret in the operator's namespace holding the default RaaS connection.
            connection:
              type: object
              description: |
                The default RaaS connection, used by every SaltKeyConfig without
                spec.credentialsSecret. With username set, the bundle creates the
                connection Secret from these values, the supported route on a
                Supervisor, where the service namespace is not writable otherwise.
              properties:
                url:
                  type: string
                  default: ""
                masterID:
                  type: string
                  default: ""
                username:
                  type: string
                  default: ""
                password:
                  type: string
                  default: ""
                insecureSkipVerify:
                  type: boolean
                  default: false
        enrolment:
          type: object
          description: |
            Namespaces the operator enrols itself, each with a SaltKeyConfig named
            salt-config that uses the default connection. Off unless one of
            namespaces, all or namespaceSelector is set. A namespace that already
            has a SaltKeyConfig is never enrolled, and a team config added later
            replaces the operator's. Turning enrolment off removes the configs it
            created.
          properties:
            namespaces:
              type: array
              items:
                type: string
              default: []
            all:
              type: boolean
              default: false
            namespaceSelector:
              type: string
              default: ""
            excludePrefixes:
              type: string
              default: ""
            keyAcceptance:
              type: string
              enum: [discovery, preseed]
              default: discovery
              description: |
                keyAcceptance of the SaltKeyConfigs the operator enrols. Preseed also
                grants the operator create, update and patch of Secrets, never read.
        scavenger:
          type: object
          description: Stale key scavenger.
          properties:
            excludeMinions:
              type: string
              default: ""
              description: |
                Comma-separated glob patterns of minion IDs the scavenger never
                reports or deletes, such as the master's own minion and any minion
                that is not a VM, for example saltmaster,infra-*.
        rbac:
          type: object
          description: Operator permissions.
          properties:
            tenantCredentialSecrets:
              type: boolean
              default: true
              description: |
                Grant cluster-wide read of Secrets, for SaltKeyConfigs that name a
                credentials Secret in their own namespace. Set false when every
                SaltKeyConfig uses the default connection, which a VCF Service
                install requires.
            preseedKeys:
              type: boolean
              default: false
              description: |
                Grant cluster-wide create, update and patch of Secrets, never read, for
                team SaltKeyConfigs with keyAcceptance preseed. Not needed when
                enrolment.keyAcceptance is preseed, which grants the same. The
                operator writes each VM's key pair to the Secret <vm>-salt-bootstrap.
  template:
    spec:
      fetch:
      - imgpkgBundle:
          image: ghcr.io/stanimir-kozarev/vcf-salt-operator-bundle:__VERSION__
      template:
      - ytt:
          paths:
          - config/
      - kbld:
          paths:
          - "-"
          - .imgpkg/images.yml
      deploy:
      - kapp: {}
