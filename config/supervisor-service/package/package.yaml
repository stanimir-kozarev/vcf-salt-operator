---
# Versioned Package. `metadata.name` MUST be "<refName>.<version>".
# The imgpkgBundle image reference is rewritten to an immutable digest by
# `make supervisor-service-yaml` at release time.
apiVersion: data.packaging.carvel.dev/v1alpha1
kind: Package
metadata:
  name: vcf-salt-operator.salt.vcf.io.0.2.0
  namespace: tkg-system
spec:
  refName: vcf-salt-operator.salt.vcf.io
  version: 0.2.0
  releaseNotes: |
    - VM reconvergence from terminal Failed/<step> states, triggered by an intent
      annotation change, a per-VM salt.vcf.io/retry-request, or a namespace-wide
      SaltKeyConfig.spec.retryToken
    - Day-2 change detection covers the full tenant-set salt.vcf.io/* annotation set,
      not only salt.vcf.io/roles
    - Scavenger CronJob defaults to --dry-run=true; a key with no correlated VM is
      logged at error level in both modes
  valuesSchema:
    openAPIv3:
      title: vcf-salt-operator.salt.vcf.io values schema
      type: object
      additionalProperties: false
      properties:
        namespace:
          type: string
          default: vcf-salt-operator-system
          description: Namespace where the operator and scavenger are deployed.
        image:
          type: object
          description: Operator container image settings.
          properties:
            repository:
              type: string
              default: ghcr.io/stanimir-kozarev/vcf-salt-operator
            tag:
              type: string
              default: "0.2.0"
            pullPolicy:
              type: string
              default: IfNotPresent
              enum: ["Always", "IfNotPresent", "Never"]
        resources:
          type: object
          properties:
            limits:
              type: object
              properties:
                cpu:
                  type: string
                  default: "500m"
                memory:
                  type: string
                  default: "128Mi"
            requests:
              type: object
              properties:
                cpu:
                  type: string
                  default: "10m"
                memory:
                  type: string
                  default: "64Mi"
        imagePullSecret:
          type: object
          description: |
            Optional registry credentials. If dockerconfigjson is set, a Secret
            is created and wired to the operator and scavenger pods.
          properties:
            dockerconfigjson:
              type: string
              default: ""
              description: Base64-encoded contents of a .dockerconfigjson file.
        raas:
          type: object
          description: VCF Salt (RaaS) client defaults.
          properties:
            defaultInsecureSkipVerify:
              type: boolean
              default: false
              description: |
                If true, SaltKeyConfig instances default to skipping TLS
                verification against the RaaS endpoint. Per-SaltKeyConfig
                settings still override this.
  template:
    spec:
      fetch:
      - imgpkgBundle:
          # Rewritten to an immutable digest by `make supervisor-service-yaml`.
          image: ghcr.io/stanimir-kozarev/vcf-salt-operator-bundle:0.2.0
      template:
      - ytt:
          paths:
          - config/
      - kbld:
          paths:
          - "-"
          - .imgpkg/images.yml
      deploy:
      - kapp: {}
