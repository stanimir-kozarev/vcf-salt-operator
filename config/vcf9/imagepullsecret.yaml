---
# imagePullSecret for the Container Registry.
#
# Generate with:
#   kubectl create secret docker-registry registry-credentials \
#     -n vcf-salt-operator-system \
#     --docker-server=<your-registry> \
#     --docker-username=<user-or-deploy-token> \
#     --docker-password=<password-or-token> \
#     --dry-run=client -o yaml > config/vcf9/imagepullsecret.yaml
#
# Then commit the file (do NOT commit real credentials — use a deploy token with
# read_registry scope and store it in a CI/CD variable or Vault).
apiVersion: v1
kind: Secret
metadata:
  name: registry-credentials
  namespace: vcf-salt-operator-system
type: kubernetes.io/dockerconfigjson
data:
  .dockerconfigjson: <base64-encoded-dockerconfig>   # replace with real value
