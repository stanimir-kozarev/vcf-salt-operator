---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: vcf-salt-scavenger
  namespace: vcf-salt-operator-system
spec:
  schedule: "0 2 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        spec:
          serviceAccountName: vcf-salt-scavenger
          restartPolicy: OnFailure
          containers:
          - name: scavenger
            image: ghcr.io/stanimir-kozarev/vcf-salt-operator:latest
            command: ["/scavenger"]
            resources:
              requests:
                cpu: 50m
                memory: 64Mi
              limits:
                cpu: 200m
                memory: 128Mi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              runAsNonRoot: true
              capabilities:
                drop: ["ALL"]
